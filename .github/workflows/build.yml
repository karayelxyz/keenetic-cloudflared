name: Sync, Build, Archive and Update Root

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get Latest Upstream Version (Date Tag)
        id: upstream
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Upstream date version: $LATEST_TAG"

      - name: Check if Version Already Exists
        id: check_version
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          if [ -d "archive/$TAG" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $TAG already exists in archive. Skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New version $TAG detected! Starting build and sync process..."
          fi

      - name: Download Official ARM64 Binary
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          mkdir -p "archive/$TAG"
          echo "Downloading official ARM64 binary for $TAG..."
          curl -L -o "archive/$TAG/cloudflared" "https://github.com/cloudflare/cloudflared/releases/download/$TAG/cloudflared-linux-arm64"
          chmod +x "archive/$TAG/cloudflared"

      - name: Set up Go
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build MIPSLE Binary from Source
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          echo "Cloning source code at tag $TAG..."
          git clone --depth 1 --branch "$TAG" https://github.com/cloudflare/cloudflared.git cf-src
          cd cf-src
          echo "Compiling for MIPSLE (softfloat)..."
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="-s -w" -o ../archive/$TAG/cloudflared-mipsle ./cmd/cloudflared
          cd ..
          chmod +x "archive/$TAG/cloudflared-mipsle"

      - name: Copy Latest Binaries to Root Directory
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          echo "Copying new binaries to root directory..."
          cp "archive/$TAG/cloudflared" ./cloudflared
          cp "archive/$TAG/cloudflared-mipsle" ./cloudflared-mipsle
          chmod +x cloudflared cloudflared-mipsle

      - name: Commit and Push Changes
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          git add archive/$TAG/ cloudflared cloudflared-mipsle
          git commit -m "Update cloudflared to version $TAG (Root binaries updated & archived)"
          git push
