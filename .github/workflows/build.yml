name: Sync, Build, Archive and Update Root

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if release already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Latest Upstream Version (Date Tag)
        id: upstream
        run: |
          set -euo pipefail
          LATEST_TAG=$(curl -fSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          if ! [[ "$LATEST_TAG" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream tag: '$LATEST_TAG' (API rate limit or unexpected response). Failing fast." >&2
            exit 1
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Upstream date version: $LATEST_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Release Already Exists
        id: check_version
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists. Skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New version $TAG detected! Starting build and sync process..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Official ARM64 Binary
        if: steps.check_version.outputs.exists == 'false' || inputs.force == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          mkdir -p "archive/$TAG"
          echo "Downloading official ARM64 binary for $TAG..."
          curl -fSL --retry 3 -o "archive/$TAG/cloudflared" "https://github.com/cloudflare/cloudflared/releases/download/$TAG/cloudflared-linux-arm64"
          chmod +x "archive/$TAG/cloudflared"

      - name: Set up Go
        if: steps.check_version.outputs.exists == 'false' || inputs.force == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build MIPSLE Binary from Source
        if: steps.check_version.outputs.exists == 'false' || inputs.force == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          echo "Cloning source code at tag $TAG..."
          git clone --depth 1 --branch "$TAG" https://github.com/cloudflare/cloudflared.git cf-src
          cd cf-src
          echo "Compiling for MIPSLE (softfloat)..."
          # BuiltForPackageManager makes the built-in updater refuse to run: it
          # would download a Cloudflare build for another architecture over this
          # mipsle binary. Updates come from this repository's releases instead.
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build \
            -ldflags="-s -w -X main.Version=$TAG -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/cloudflare/cloudflared/cmd/cloudflared/updater.BuiltForPackageManager=keenetic" \
            -o ../archive/$TAG/cloudflared-mipsle ./cmd/cloudflared
          cd ..
          chmod +x "archive/$TAG/cloudflared-mipsle"

      - name: Smoke Test MIPSLE Binary
        if: steps.check_version.outputs.exists == 'false' || inputs.force == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          BIN="archive/$TAG/cloudflared-mipsle"
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          echo "Starting the mipsle binary under qemu: it must survive startup..."
          timeout 60 qemu-mipsel-static "$BIN" --help >/dev/null
          echo "Binary starts under qemu."
          if ! grep -q "keenetic" "$BIN"; then
            echo "Package-manager stamp is missing from the binary." >&2
            exit 1
          fi
          echo "Updater opt-out stamp is present."

      - name: Prepare Release Notes from Upstream
        if: steps.check_version.outputs.exists == 'false' || inputs.force == 'true'
        id: release_notes
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          curl -fSL --retry 3 "https://raw.githubusercontent.com/cloudflare/cloudflared/master/RELEASE_NOTES" -o /tmp/RELEASE_NOTES
          awk -v tag="$TAG" '
            $0 == tag {flag=1; next}
            flag && /^[0-9]{4}\.[0-9]+\.[0-9]+/ {exit}
            flag {print}
          ' /tmp/RELEASE_NOTES > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "No upstream notes found for $TAG" > /tmp/release_notes.md
          fi
          cat /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_version.outputs.exists == 'false' || inputs.force == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          echo "Creating release $TAG with binaries..."
          gh release create "$TAG" "archive/$TAG/cloudflared" "archive/$TAG/cloudflared-mipsle" --title "$TAG" --notes-file /tmp/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
