name: Sync, Build, Archive and Update Root

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Latest Upstream Version (Date Tag)
        id: upstream
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r .tag_name)
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Upstream date version: $LATEST_TAG"

      - name: Check if Release Already Exists
        id: check_version
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists. Skipping..."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New version $TAG detected! Starting build and sync process..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Official ARM64 Binary
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          mkdir -p "archive/$TAG"
          echo "Downloading official ARM64 binary for $TAG..."
          curl -L -o "archive/$TAG/cloudflared" "https://github.com/cloudflare/cloudflared/releases/download/$TAG/cloudflared-linux-arm64"
          chmod +x "archive/$TAG/cloudflared"

      - name: Set up Go
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build MIPSLE Binary from Source
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          echo "Cloning source code at tag $TAG..."
          git clone --depth 1 --branch "$TAG" https://github.com/cloudflare/cloudflared.git cf-src
          cd cf-src
          echo "Compiling for MIPSLE (softfloat)..."
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="-s -w" -o ../archive/$TAG/cloudflared-mipsle ./cmd/cloudflared
          cd ..
          chmod +x "archive/$TAG/cloudflared-mipsle"

      - name: Prepare Release Notes from Upstream
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        id: release_notes
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          curl -sL "https://raw.githubusercontent.com/cloudflare/cloudflared/master/RELEASE_NOTES" -o /tmp/RELEASE_NOTES
          awk -v tag="$TAG" '
            $0 == tag {flag=1; print "## Upstream cloudflared " tag; print ""; print "Source: https://github.com/cloudflare/cloudflared/blob/master/RELEASE_NOTES"; print ""; next}
            flag && /^[0-9]{4}\.[0-9]+\.[0-9]+/ {exit}
            flag {print}
          ' /tmp/RELEASE_NOTES > /tmp/upstream_notes.txt
          if [ ! -s /tmp/upstream_notes.txt ]; then
            echo "No upstream notes found for $TAG" > /tmp/upstream_notes.txt
            echo "" >> /tmp/upstream_notes.txt
            cat /tmp/RELEASE_NOTES | head -20 >> /tmp/upstream_notes.txt
          fi
          {
            cat /tmp/upstream_notes.txt
            echo ""
            echo "---"
            echo "Keenetic builds: \`cloudflared\` (arm64, official) + \`cloudflared-mipsle\` (mipsle softfloat, built from source)"
            echo "Install: \`wget -qO- https://raw.githubusercontent.com/karayelxyz/keenetic-cloudflared/main/install_cloudflared.sh | sh\`"
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          echo "Creating release $TAG with binaries..."
          gh release create "$TAG" "archive/$TAG/cloudflared" "archive/$TAG/cloudflared-mipsle" --title "$TAG" --notes-file /tmp/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
